services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tubo
      # Local development only. Real environments inject this from a secret manager.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tubo_dev_password}
      POSTGRES_DB: tubo
    ports:
      - "5433:5432"
    volumes:
      - tubo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubo -d tubo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tubo_pgdata:
